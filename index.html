<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場報到掃描</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, "PingFang TC", Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background:#f7f7f8; }
  h2 { text-align:center; }
  label { display:block; margin:16px 0 6px; font-size:14px; color:#333; }
  input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; }
  button { width:100%; margin-top:16px; padding:12px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-size:16px; cursor:pointer; box-sizing:border-box; }
  button.secondary { background:#e5e7eb; color:#333; }
  .mode-tabs { display:flex; gap:8px; margin-bottom:12px; }
  .mode-tabs .tab { flex:1; width:auto; margin-top:0; padding:10px 4px; border:1px solid #ddd; background:#fff; color:#333; border-radius:8px; font-size:12px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; box-sizing:border-box; }
  .mode-tabs .tab.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  #reader { width: 100%; border-radius: 12px; overflow:hidden; }
  .hint { font-size:12px; color:#888; margin-top:8px; line-height:1.5; }
  #fileInput { width:100%; padding:14px; border:2px dashed #bbb; border-radius:10px; background:#fff; box-sizing:border-box; }
  #result { margin-top: 16px; padding: 16px; border-radius: 10px; text-align:center; font-size: 18px; font-weight:600; display:none; }
  .success { background:#d6f5df; color:#146c2e; }
  .duplicate { background:#fff3cd; color:#8a6300; }
  .error { background:#fde2e1; color:#a3231d; }
  #log { margin-top:12px; font-size:13px; color:#666; max-height:160px; overflow-y:auto; }
  #log div { padding:4px 0; border-bottom:1px solid #eee; }
  #settingsMsg { margin-top:12px; font-size:14px; padding:10px; border-radius:8px; display:none; }
  .ok { background:#d6f5df; color:#146c2e; }
  .err { background:#fde2e1; color:#a3231d; }
  #resultOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; align-items:center; justify-content:center; padding:24px; }
  #resultOverlay.show { display:flex; }
  #resultModal { background:#fff; border-radius:16px; padding:28px 20px; max-width:320px; width:100%; text-align:center; }
  #resultModal .icon { font-size:48px; margin-bottom:8px; }
  #resultModal .text { font-size:18px; font-weight:700; margin-bottom:16px; }
  #resultModal.success .text { color:#146c2e; }
  #resultModal.duplicate .text { color:#8a6300; }
  #resultModal.error .text { color:#a3231d; }
  #resultModal button { width:100%; margin-top:0; padding:10px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-size:15px; cursor:pointer; }
  #confirmOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:210; align-items:center; justify-content:center; padding:24px; }
  #confirmOverlay.show { display:flex; }
  #confirmModal { background:#fff; border-radius:16px; padding:24px 20px; max-width:340px; width:100%; text-align:center; }
  #confirmModal .cname { font-size:20px; font-weight:700; margin-bottom:4px; }
  #confirmModal .creg { font-size:13px; color:#888; margin-bottom:16px; }
  #confirmModal .clabel { font-size:14px; color:#333; margin-bottom:8px; }
  #confirmModal .stepper { display:flex; align-items:stretch; gap:8px; margin-bottom:18px; }
  #confirmModal .stepper button { width:56px; margin:0; padding:0; font-size:26px; line-height:1; background:#eef2ff; color:#2563eb; border:1px solid #c7d2fe; border-radius:10px; cursor:pointer; flex-shrink:0; }
  #confirmModal .stepper button:disabled { background:#f3f4f6; color:#c4c4c4; border-color:#e5e7eb; cursor:not-allowed; }
  #confirmModal .stepper input { flex:1; width:auto; min-width:0; text-align:center; font-size:26px; font-weight:700; padding:8px; border:1px solid #ddd; border-radius:10px; box-sizing:border-box; }
  #confirmModal .cbtns { display:flex; gap:10px; }
  #confirmModal .cbtns button { flex:1; margin:0; padding:12px; border:none; border-radius:10px; font-size:16px; cursor:pointer; }
  #confirmModal .cbtns .ok { background:#16a34a; color:#fff; }
  #confirmModal .cbtns .cancel { background:#e5e7eb; color:#333; }
  #confirmModal .cbtns button:disabled { opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>
  <h2>現場報到掃描</h2>

  <div id="settingsCard">
    <p class="hint">首次使用請先登入，登入狀態會記在這台裝置上（清除瀏覽器資料或按登出才需要重新輸入）。</p>
    <label>Apps Script 網頁應用程式網址</label>
    <input type="text" id="apiInput" placeholder="https://script.google.com/macros/s/xxxx/exec">
    <label>帳號</label>
    <input type="text" id="usernameInput">
    <label>密碼</label>
    <input type="password" id="passwordInput">
    <button onclick="doStaffLogin()" id="loginBtn">登入</button>
    <div id="settingsMsg"></div>
  </div>

  <div id="mainUI" style="display:none;">
    <div class="mode-tabs">
      <button id="tabCamera" class="tab active" onclick="switchMode('camera')">即時相機掃描</button>
      <button id="tabPhoto" class="tab" onclick="switchMode('photo')">拍照掃描</button>
    </div>
    <div id="cameraMode"><div id="reader"></div></div>
    <div id="photoMode" style="display:none;">
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <p class="hint">點擊後會開啟手機相機拍照，拍下 QR Code 後自動判讀報到。</p>
    </div>
    <div id="result"></div>
    <div id="log"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <a id="backLink" href="#" onclick="goBack(event)" style="flex:1;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:12px;font-size:14px;color:#666;text-decoration:none;border:1px solid #ddd;border-radius:8px;white-space:nowrap;">← 返回上一頁</a>
      <button class="secondary" onclick="logoutStaff()" style="flex:1;margin-top:0;white-space:nowrap;">登出</button>
    </div>
  </div>

  <div id="resultOverlay"><div id="resultModal">
    <div class="icon" id="resultModalIcon"></div>
    <div class="text" id="resultModalText"></div>
    <button onclick="closeResultModal()">繼續掃描</button>
  </div></div>

  <div id="confirmOverlay"><div id="confirmModal">
    <div class="cname" id="confirmName"></div>
    <div class="creg" id="confirmReg"></div>
    <div class="clabel">實際報到人數</div>
    <div class="stepper">
      <button type="button" id="hcMinus">－</button>
      <input type="text" id="hcInput" inputmode="numeric" pattern="[0-9]*">
      <button type="button" id="hcPlus">＋</button>
    </div>
    <div class="cbtns">
      <button type="button" class="cancel" onclick="cancelConfirm()">取消</button>
      <button type="button" class="ok" id="confirmOkBtn" onclick="confirmCheckin()">確認報到</button>
    </div>
  </div></div>

  <script>
    var API_URL = '';
    var TOKEN = '';
    var lastId = null;
    var lastTime = 0;
    var cameraStarted = false;
    var html5QrCode = new Html5Qrcode("reader");

    function showSettingsMsg(cls, text) {
      var el = document.getElementById('settingsMsg');
      el.style.display = 'block';
      el.className = cls;
      el.textContent = text;
    }

    function loadSettings() {
      var params = new URLSearchParams(location.search);
      var qApi = params.get('api');
      var qToken = params.get('token');

      API_URL = qApi || localStorage.getItem('checkin_api') || '';
      TOKEN = qToken || localStorage.getItem('checkin_token') || '';

      if (qApi) localStorage.setItem('checkin_api', qApi);
      if (qToken) localStorage.setItem('checkin_token', qToken);

      document.getElementById('apiInput').value = API_URL;

      if (API_URL && TOKEN) {
        enterMainUI();
      } else {
        showLoginForm();
      }
    }

    function showLoginForm() {
      document.getElementById('mainUI').style.display = 'none';
      document.getElementById('settingsCard').style.display = 'block';
      stopCamera();
    }

    function enterMainUI() {
      document.getElementById('settingsCard').style.display = 'none';
      document.getElementById('mainUI').style.display = 'block';
      document.getElementById('backLink').href = API_URL;
      startCamera();
    }

    function goBack(e) {
      if (e) e.preventDefault();
      if (API_URL) { location.href = API_URL + '?page=login'; }
    }

    function doStaffLogin() {
      var api = document.getElementById('apiInput').value.trim();
      var username = document.getElementById('usernameInput').value.trim();
      var password = document.getElementById('passwordInput').value.trim();
      if (!api || !username || !password) { showSettingsMsg('err', '請完整輸入網址、帳號與密碼。'); return; }

      API_URL = api;
      localStorage.setItem('checkin_api', API_URL);

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登入中...';

      jsonpLogin(username, password, function (err, res) {
        btn.disabled = false;
        btn.textContent = '登入';
        if (err) { showSettingsMsg('err', '連線失敗，請確認網址是否正確。'); return; }
        if (!res.success) { showSettingsMsg('err', res.message); return; }
        TOKEN = res.token;
        localStorage.setItem('checkin_token', TOKEN);
        enterMainUI();
      });
    }

    function logoutStaff() {
      localStorage.removeItem('checkin_token');
      TOKEN = '';
      stopCamera();
      showLoginForm();
    }

    function jsonpLogin(username, password, onDone) {
      var callbackName = 'jsonp_login_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      var script = document.createElement('script');
      window[callbackName] = function (res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        onDone(null, res);
      };
      script.src = API_URL + '?action=login&username=' + encodeURIComponent(username) +
        '&password=' + encodeURIComponent(password) + '&callback=' + callbackName;
      script.onerror = function () {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        onDone(new Error('連線失敗'));
      };
      document.body.appendChild(script);
    }

    // action：'lookup'（只查詢，不寫入）或 'checkin'（確認人數後正式報到）
    function jsonpCheckin(action, id, headcount, onDone) {
      var callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      var script = document.createElement('script');
      window[callbackName] = function (res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        onDone(null, res);
      };
      script.src = API_URL + '?action=' + action + '&id=' + encodeURIComponent(id) +
        (headcount !== null && headcount !== undefined ? '&headcount=' + encodeURIComponent(headcount) : '') +
        '&token=' + encodeURIComponent(TOKEN) + '&callback=' + callbackName;
      script.onerror = function () {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        onDone(new Error('連線失敗'));
      };
      document.body.appendChild(script);
    }

    function showResult(cls, text) {
      var r = document.getElementById('result');
      r.className = cls;
      r.textContent = text;
      r.style.display = 'block';
    }

    function addLog(text) {
      var log = document.getElementById('log');
      var line = document.createElement('div');
      line.textContent = new Date().toLocaleTimeString() + ' — ' + text;
      log.insertBefore(line, log.firstChild);
    }

    var resultModalTimer = null;

    function showResultModal(cls, icon, text) {
      var modal = document.getElementById('resultModal');
      modal.className = cls;
      document.getElementById('resultModalIcon').textContent = icon;
      document.getElementById('resultModalText').textContent = text;
      document.getElementById('resultOverlay').className = 'show';
      if (resultModalTimer) clearTimeout(resultModalTimer);
      resultModalTimer = setTimeout(closeResultModal, 2500);
    }

    function closeResultModal() {
      document.getElementById('resultOverlay').className = '';
      if (resultModalTimer) { clearTimeout(resultModalTimer); resultModalTimer = null; }
    }

    var HC_MIN = 0, HC_MAX = 99;
    var pendingId = null;     // 正在確認人數的 QR（確認視窗開著時，不處理新的掃描）
    var hcDefault = 1;

    function clampHc() {
      var input = document.getElementById('hcInput');
      var n = parseInt(String(input.value).replace(/[^0-9]/g, ''), 10);
      if (isNaN(n)) n = hcDefault;
      n = Math.max(HC_MIN, Math.min(HC_MAX, n));
      input.value = n;
      document.getElementById('hcMinus').disabled = n <= HC_MIN;
      document.getElementById('hcPlus').disabled = n >= HC_MAX;
    }
    document.getElementById('hcMinus').onclick = function () { clampHc(); var i = document.getElementById('hcInput'); i.value = Math.max(HC_MIN, parseInt(i.value, 10) - 1); clampHc(); };
    document.getElementById('hcPlus').onclick = function () { clampHc(); var i = document.getElementById('hcInput'); i.value = Math.min(HC_MAX, parseInt(i.value, 10) + 1); clampHc(); };
    document.getElementById('hcInput').oninput = function () { this.value = this.value.replace(/[^0-9]/g, ''); };
    document.getElementById('hcInput').onblur = clampHc;
    document.getElementById('hcInput').onfocus = function () { this.select(); };

    function openConfirm(res, id) {
      pendingId = id;
      hcDefault = res.registeredHeadcount || 1;
      document.getElementById('confirmName').textContent = res.name;
      document.getElementById('confirmReg').textContent = res.hasHeadcountField ? ('報名人數：' + res.registeredHeadcount + ' 人') : '請確認現場實際人數';
      document.getElementById('hcInput').value = hcDefault;
      clampHc();
      document.getElementById('confirmOkBtn').disabled = false;
      document.getElementById('confirmOverlay').className = 'show';
    }

    function closeConfirm() {
      document.getElementById('confirmOverlay').className = '';
      pendingId = null;
    }

    function cancelConfirm() {
      closeConfirm();
      lastId = null; // 取消後可立刻重新掃描同一組 QR
      addLog('已取消報到');
    }

    function showFinalResult(res) {
      if (res.status === 'success') {
        showResult('success', '✅ ' + res.message);
        showResultModal('success', '✅', res.message);
      } else if (res.status === 'duplicate') {
        showResult('duplicate', '⚠️ ' + res.message);
        showResultModal('duplicate', '⚠️', res.message);
      } else {
        showResult('error', '❌ ' + res.message);
        showResultModal('error', '❌', res.message);
      }
      addLog(res.message);
    }

    function confirmCheckin() {
      clampHc();
      var id = pendingId;
      if (!id) return;
      var headcount = document.getElementById('hcInput').value;
      document.getElementById('confirmOkBtn').disabled = true;
      jsonpCheckin('checkin', id, headcount, function (err, res) {
        closeConfirm();
        if (err) {
          showResult('error', '連線失敗，請確認網路連線。');
          showResultModal('error', '❌', '連線失敗，請確認網路連線。');
          addLog('連線失敗');
          return;
        }
        if (res.status === 'error' && res.message && res.message.indexOf('重新登入') > -1) {
          logoutStaff();
          return;
        }
        showFinalResult(res);
      });
    }

    function handleDecoded(decodedText) {
      if (pendingId) return; // 確認視窗開著時不處理新的掃描
      var now = Date.now();
      if (decodedText === lastId && now - lastTime < 4000) return;
      lastId = decodedText;
      lastTime = now;

      jsonpCheckin('lookup', decodedText, null, function (err, res) {
        if (err) {
          showResult('error', '連線失敗，請確認網路連線。');
          showResultModal('error', '❌', '連線失敗，請確認網路連線。');
          addLog('連線失敗');
          return;
        }
        if (res.status === 'error' && res.message && res.message.indexOf('重新登入') > -1) {
          logoutStaff();
          return;
        }
        if (res.status === 'ready') {
          openConfirm(res, decodedText);
        } else {
          showFinalResult(res);
        }
      });
    }

    function startCamera() {
      if (cameraStarted) return;
      Html5Qrcode.getCameras().then(function (devices) {
        if (!devices || !devices.length) { showResult('error', '找不到可用的相機，請改用「拍照掃描」。'); return; }
        var cameraId = devices.length > 1 ? devices[devices.length - 1].id : devices[0].id;
        html5QrCode.start(cameraId, { fps: 10, qrbox: 250, videoConstraints: { facingMode: { ideal: 'environment' }, advanced: [{ zoom: 1 }] } }, handleDecoded)
          .then(function () { cameraStarted = true; })
          .catch(function () { showResult('error', '無法啟用相機，請改用「拍照掃描」。'); });
      }).catch(function () { showResult('error', '無法取得相機清單，請改用「拍照掃描」。'); });
    }

    function stopCamera() {
      if (cameraStarted) { html5QrCode.stop().then(function () { cameraStarted = false; }).catch(function () {}); }
    }

    function switchMode(mode) {
      document.getElementById('tabCamera').className = 'tab' + (mode === 'camera' ? ' active' : '');
      document.getElementById('tabPhoto').className = 'tab' + (mode === 'photo' ? ' active' : '');
      document.getElementById('cameraMode').style.display = mode === 'camera' ? 'block' : 'none';
      document.getElementById('photoMode').style.display = mode === 'photo' ? 'block' : 'none';
      document.getElementById('result').style.display = 'none';
      if (mode === 'camera') { startCamera(); } else { stopCamera(); }
    }

    document.getElementById('fileInput').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      html5QrCode.scanFile(file, false)
        .then(function (decodedText) { handleDecoded(decodedText); })
        .catch(function () { showResult('error', '無法從照片中讀取 QR Code，請重新拍攝。'); });
      e.target.value = '';
    });

    loadSettings();
  </script>
</body>
</html>
